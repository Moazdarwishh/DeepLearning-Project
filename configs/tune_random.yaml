_base_: base.yaml
experiment:
  name: tune-random
  task: classification
  tags: [tuning, random]
data:
  normalization: imagenet
  batch_size: 64
model:
  name: resnet50
  pretrained: true
  freeze_backbone: true
train:
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
  early_stopping_patience: 0
  save_every_epoch: false
tuning:
  method: random
  n_trials: 8
  epochs_per_trial: 5
  seed: 0
  search_space:
    train.lr: {dist: loguniform, low: 1.0e-3, high: 1.0e-2}
    train.weight_decay: {dist: loguniform, low: 1.0e-4, high: 1.0e-2}
    model.dropout: {dist: uniform, low: 0.2, high: 0.5}
tracking:
  backend: mlflow
  project: pixels-to-language-tuning
