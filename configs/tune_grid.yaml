_base_: base.yaml
experiment:
  name: tune-grid
  task: classification
  tags: [tuning, grid]
data:
  normalization: imagenet
  batch_size: 64
model:
  name: resnet50
  pretrained: true
  freeze_backbone: true
train:
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
  early_stopping_patience: 0
  save_every_epoch: false
tuning:
  method: grid
  epochs_per_trial: 5
  search_space:
    train.lr: [1.0e-3, 1.0e-2]
    train.weight_decay: [1.0e-4, 1.0e-2]
    model.dropout: [0.2, 0.5]
tracking:
  backend: mlflow
  project: pixels-to-language-tuning
