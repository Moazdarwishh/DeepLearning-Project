_base_: base.yaml
experiment:
  name: cls-resnet50-probe
  task: classification
  tags: [classification, transfer, resnet50, linear-probe]
data:
  normalization: imagenet
  batch_size: 64
model:
  name: resnet50
  pretrained: true
  dropout: 0.3
  freeze_backbone: true
train:
  epochs: 30
  optimizer: adamw
  lr: 3.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
  early_stopping_patience: 8
